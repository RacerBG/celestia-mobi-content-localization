<h3 id="compatibility">兼容性</h3>
<p>移动版 Celestia 也支持连接到设备的鼠标和键盘。切换到 <code>相机模式</code>后，鼠标和键盘的操作行为与桌面版非常相似。</p>
<figure style="margin-left:0;margin-right:0"><div class="table-scroll" tabindex="0" role="region" aria-label="平台"><table>
<thead>
<tr>
<th>平台</th>
<th>问题</th>
<th>解决方法</th>
</tr>
</thead>
<tbody>
<tr>
<td>Android</td>
<td>无法使用鼠标右键操作（单击／拖动）</td>
<td>按住 ALT 键并使用鼠标左键</td>
</tr>
<tr>
<td>Chrome OS</td>
<td>CTRL + 拖动不起作用</td>
<td>使用 CTRL + 拖动时同时按住 ALT 键</td>
</tr>
<tr>
<td>Android/Chrome OS</td>
<td>键盘有时不起作用</td>
<td>出现此问题时，尝试按几次 Enter 键</td>
</tr>
<tr>
